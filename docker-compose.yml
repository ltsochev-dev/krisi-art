# Single standalone container — the same image the VPS runs. SQLite means one
# writer, so there is exactly one replica and no database service to link.
#
#   docker compose up --build
#
# Migrations run on boot (NODE_ENV=production is baked into the runner stage),
# so the volume is migrated in place on every deploy. Never seed the `database`
# volume from a development SQLite file: a schema-pushed database carries a
# `batch: -1` row that makes `migrate()` prompt, and with no TTY that exits zero
# having run nothing.

services:
  app:
    build:
      context: .
      # `next build` inlines these into the browser bundle, so they are needed
      # at build time, not run time — `env_file` below is too late for them.
      # Compose interpolates from the project-directory `.env`, the same file
      # the container reads. Unset means PostHog silently no-ops in the image.
      args:
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    restart: unless-stopped
    ports:
      - '3000:3000'
    # A ceiling, so a runaway container is killed and restarted instead of
    # taking the host down with it.
    #
    # This is written down because it happened: a gallery's tiles went through
    # the image optimiser, each one decoding a 20-megapixel original, and enough
    # of them at once exhausted the box's memory. What follows from that is not
    # a slow page — it is a load average in the hundreds while the kernel
    # swaps, sshd starved of the memory it needs to fork a login, and no way
    # back in short of a console or a hard reboot. The cause is fixed (previews
    # are resized once at upload and nothing on a commission page touches the
    # optimiser now), but the class of failure is worth closing off, because a
    # container that dies and restarts is a five-second outage and a box that
    # thrashes is an afternoon.
    #
    # `memswap_limit` equal to `mem_limit` is the half that matters: it denies
    # the container swap entirely, so it is OOM-killed at the limit rather than
    # allowed to thrash its way there. With `restart: unless-stopped` above,
    # Docker brings it straight back.
    #
    # **Tune this to the box.** It has to leave the host enough to keep sshd and
    # nginx comfortable — on a 2GB VPS this is about right; on a 1GB one lower
    # it to 700m, and on 4GB or more it can go up. Too high only makes it less
    # protective; too low costs restarts under normal load.
    mem_limit: 1500m
    memswap_limit: 1500m
    env_file:
      - .env
    # DATABASE_URL is relative to the app's working directory (/app), so the
    # default `file:./database/krisi-dba.sqlite` lands in the volume below.
    # APP_URL must be the origin a browser actually hits — the Cognito redirect
    # and sign-out URLs are derived from it and must match the app client.
    volumes:
      - database:/app/database
      # Only used when S3_BUCKET is unset, when uploads fall back to local disk.
      - media:/app/media
      # The `next/image` optimiser's output, which is otherwise in the
      # container's writable layer and therefore discarded on every deploy.
      # It matters much less than it did — a gallery's tiles are now previews
      # stored in the bucket and fetched straight from S3 — but the fallback
      # path for a photo without one still goes through the optimiser, as does
      # the rest of the site, and re-doing that work on every release is pure
      # waste. Tens of megabytes at most: the files in it are the ~15KB WebPs
      # it serves.
      - image-cache:/app/.next/cache/images
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/access').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  database:
  media:
  image-cache:
