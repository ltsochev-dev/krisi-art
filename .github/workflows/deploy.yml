# Build -> verify -> push to GHCR -> deploy to the VPS over SSH.
#
# Every push builds and publishes an image tagged with the full commit SHA.
# Deploys happen automatically for `main`, and on demand for any other branch
# via "Run workflow" (pick the branch in the UI).
#
# Required secrets:
#   DEPLOY_SSH_KEY          Private key (PEM, no passphrase) whose public half is
#                           in the deploy user's ~/.ssh/authorized_keys on the VPS.
#   DEPLOY_HOST             VPS hostname or IP.
#   DEPLOY_USER             SSH user (must be able to run docker).
#   DEPLOY_KNOWN_HOSTS      Optional but recommended. Output of
#                           `ssh-keyscan -p <port> <host>`. Without it the host
#                           key is trusted on first use, every run.
#
# Optional repository variables (Settings -> Secrets and variables -> Variables):
#   DEPLOY_DIR              Directory on the VPS holding docker-compose.yml and
#                           .env. Default: /opt/krisi-art
#   DEPLOY_PORT             SSH port. Default: 22
#   DEPLOY_SERVICE          Compose service name. Default: app
#   APP_URL                 Public origin, recorded on the GitHub deployment.
#   NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN
#                           Browser PostHog token. Inlined into the JS bundle at
#                           build time, so it belongs on the build and not only
#                           in the VPS `.env`. A variable rather than a secret
#                           on purpose: it ships to every visitor regardless,
#                           and masking it in the logs buys nothing.
#   NEXT_PUBLIC_POSTHOG_HOST
#                           PostHog ingestion origin, e.g.
#                           https://eu.i.posthog.com. Build-time, as above.
#
# The VPS pulls from ghcr.io with this run's GITHUB_TOKEN, so no registry
# credentials are stored on the box. See README "Continuous deployment" for the
# server-side docker-compose.yml this expects.

name: Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the VPS after a successful build
        type: boolean
        default: true

# Runs queue per ref instead of cancelling, so a deploy is never killed halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: '22.17.0'

jobs:
  verify:
    name: Typecheck, lint and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Payload refuses to initialise without these; the integration suite runs
      # against a throwaway SQLite file and never touches AWS (vitest.setup.ts
      # unsets S3_BUCKET, so uploads stay on local disk).
      DATABASE_URL: file:./database/ci.sqlite
      PAYLOAD_SECRET: ci-secret-not-used-outside-tests
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # DATABASE_URL is relative and `database/` is gitignored, so it is absent
      # from a fresh checkout. SQLite will not create the parent directory.
      - run: mkdir -p database

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Integration tests
        run: pnpm run test:int

  build:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Inlined into the client bundle by `next build` (see the Dockerfile's
          # builder stage). Absent here means PostHog is silently dead in the
          # deployed image, so set both before relying on analytics.
          build-args: |
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

  deploy:
    name: Deploy to VPS
    needs: build
    # main deploys itself; any other branch deploys only when dispatched.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      deployments: write
    # One deploy at a time — there is a single VPS behind every branch.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Open GitHub deployment
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh api --method POST "repos/${{ github.repository }}/deployments" \
            --input - --jq '.id' <<JSON
          {
            "ref": "${{ github.sha }}",
            "environment": "production",
            "production_environment": true,
            "auto_merge": false,
            "required_contexts": [],
            "description": "Deploy ${{ github.ref_name }} to the VPS"
          }
          JSON
          )
          echo "id=$id" >> "$GITHUB_OUTPUT"

          gh api --method POST "repos/${{ github.repository }}/deployments/$id/statuses" \
            -f state=in_progress \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --silent

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is unset — trusting the host key on first use."
            ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Pull image and restart on the VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/krisi-art' }}
          SERVICE: ${{ vars.DEPLOY_SERVICE || 'app' }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The assignments are prepended to the script rather than passed as
          # arguments: argv is world-readable in `ps` on the remote box, and one
          # of these is a registry token.
          {
            printf 'DEPLOY_DIR=%q\n' "$DEPLOY_DIR"
            printf 'SERVICE=%q\n' "$SERVICE"
            printf 'IMAGE=%q\n' "$IMAGE"
            printf 'IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'GHCR_USER=%q\n' "${{ github.actor }}"
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat scripts/deploy-remote.sh
          } | ssh -i ~/.ssh/deploy_key -p "$PORT" \
                -o BatchMode=yes -o ConnectTimeout=15 \
                "$USER_NAME@$HOST" 'bash -s'

      - name: Report deployment result
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          APP_URL: ${{ vars.APP_URL }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -nc \
            --arg state "$STATE" \
            --arg log "$LOG_URL" \
            --arg url "$APP_URL" \
            --arg desc "${{ github.ref_name }} @ ${{ github.sha }}" \
            '{state: $state, log_url: $log, description: $desc}
             + (if $url == "" then {} else {environment_url: $url} end)' \
          | gh api --method POST \
              "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
              --input - --silent
